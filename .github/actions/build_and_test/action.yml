name: Build and test
description: Installs the pinned toolchain, runs the Elm tests and builds the app into dist/

inputs:
  elm-version:
    description: Elm version expected from the compiler pinned in package.json
    default: '0.19.2'

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: npm

    # elm and elm-test are pinned as exact devDependencies in package.json.
    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Check Elm version
      shell: bash
      env:
        EXPECTED_ELM_VERSION: ${{ inputs.elm-version }}
      run: |
        actual_elm_version="$(npx --no-install elm --version)"
        echo "elm ${actual_elm_version}"
        test "${actual_elm_version}" = "${EXPECTED_ELM_VERSION}"

    - name: Test
      shell: bash
      run: npm test

    - name: Build
      shell: bash
      run: npm run build
