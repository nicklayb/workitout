name: Publish to Github Pages

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      # elm and elm-test are pinned as exact devDependencies in package.json.
      - run: npm ci
      - name: Check Elm version
        env:
          EXPECTED_ELM_VERSION: '0.19.2'
        run: |
          actual_elm_version="$(npx --no-install elm --version)"
          echo "elm ${actual_elm_version}"
          test "${actual_elm_version}" = "${EXPECTED_ELM_VERSION}"
      - run: npm test
      - run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
