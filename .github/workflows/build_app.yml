name: Publish to Github Pages

permissions:
  contents: read
  pages: write
  id-token: write

# Publishing only happens when a push to main changes the VERSION file, so
# bumping the version is what releases the app. It can also be run by hand.
on:
  push:
    branches: ["main"]
    paths: ["VERSION"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build_and_test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
